name: Verkaufsassistent online stellen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v6

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Abhaengigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Web-App bauen
        run: pnpm run build:web

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5

      - name: Web-Build hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
